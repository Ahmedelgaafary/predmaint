name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples benchmarks
      - run: pytest   # the CNN tests and the real-data test are skipped here (need PyTorch / the CWRU files)
      - name: Lifecycle smoke test (train, drift, gated promotion, rollback)
        run: python examples/lifecycle_demo.py /tmp/mlops_state
