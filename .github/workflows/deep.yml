# Manual workflow (Actions tab -> "Deep tests" -> Run workflow). Installs the CPU build of PyTorch and runs the
# CNN and loader tests. Kept separate so a problem here can never turn the main CI badge red.
name: Deep tests
on: workflow_dispatch
jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_cnn.py tests/test_cwru.py
